  "heading": "看板现行业务口径",
  "intro": "本资料是 Business Data MCP 的业务口径摘要，随 SQL 日更 release 封存。汇总规则由看板 SQL 与同批指标注册表共同核验。已确认的来源字段、归因和映射随发布核验。实际数值及可用维度以同批正式看板结果为准。\n",
  "sections": [
    {
      "title": "未指定范围的经营导出",
      "paragraphs": [
        "用户只问某期间的人头、工单或签约现金时，默认取语培市场总计、被动、全部新老生。例如导出本月人头与签约现金，直接取 team_metrics 的本月期间和 heads、cash 两个指标，导出同一结果的两行。留学、主动或跨业务线等范围仅在用户明确要求时加入。"
      ]
