<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>语培完成进度</title><style>body{font:15px system-ui;background:#f7f5f0;color:#17212b;margin:0}main{max-width:1000px;margin:auto;padding:36px 22px}header{display:flex;justify-content:space-between;border-bottom:2px solid;padding-bottom:16px}h1{font:700 36px Georgia;margin:8px 0}.controls{display:flex;gap:8px;align-items:center}select,button{padding:9px;border:1px solid #17212b;background:#fff;font:inherit}button{background:#d05b35;color:white;cursor:pointer}.meta{color:#65727e;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.metric{background:white;border:1px solid #d9e0e5;padding:20px}.value{font:700 34px Georgia;margin-top:18px}table{margin-top:22px;width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:10px;border-bottom:1px solid #d9e0e5}@media(max-width:650px){header{display:block}.controls{margin-top:14px}.grid{grid-template-columns:1fr}}
</style><main><header><div><div>LANGUAGE TRAINING / PROGRESS</div><h1>语培完成进度</h1></div><div class="controls"><label>期间 <select id="q"><option>全年</option><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select></label><button id="refresh">刷新</button></div></header><div id="meta" class="meta">等待刷新结果...</div><section class="grid"><article class="metric"><div>工单数量（去重）</div><div id="orders" class="value">—</div></article><article class="metric"><div>被动正向报入现金</div><div id="cash" class="value">—</div></article></section><table><thead><tr><th>团队</th><th>工单数</th><th>被动正向现金</th></tr></thead><tbody id="tbody"></tbody></table></main><script>const f=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(Number(n||0));async function load(){const j=await(await fetch('/api/latest?'+Date.now())).json(),rs=j.result?.rows||[];orders.textContent=f(rs.reduce((a,r)=>a+Number(r[1]||0),0));cash.textContent=f(rs.reduce((a,r)=>a+Number(r[2]||0),0));meta.textContent=`${j.quarter||'—'} · 运行 ${j.run_id||'—'}`;tbody.innerHTML=rs.map(r=>`<tr><td>${r[0]||'未归属'}</td><td>${f(r[1])}</td><td>${f(r[2])}</td></tr>`).join('')}refresh.onclick=async()=>{refresh.disabled=true;meta.textContent='刷新中...';await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quarter:q.value})});refresh.disabled=false;load()};load();</script>
