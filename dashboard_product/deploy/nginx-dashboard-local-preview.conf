server {
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/dashboard;
    location = / { try_files /current.html =404; }
    location = /current.html { try_files $uri =404; add_header Cache-Control "no-store"; }
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
}
