server {
    listen 80;
    listen [::]:80;
    server_name dashboard.apinova.cn;

    root /var/www/dashboard;
    index current.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files /current.html =404;
    }
}
