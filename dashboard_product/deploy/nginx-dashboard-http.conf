# HTTP vhost for dashboard.apinova.cn with one authenticated full dashboard.
# Include this file from the nginx http {} context (sites-enabled is fine).
# This round is HTTP-only. Basic auth credentials travel in Base64 on the wire
# (effectively plaintext). Put TLS in front before treating this as a real door.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.apinova.cn;

    root /var/www/dashboard;
    autoindex off;

    auth_basic "内部看板";
    auth_basic_user_file /etc/nginx/dashboard.htpasswd;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /full.html =403;
    }

    location = /full.html {
        try_files /full.html =403;
    }

    location = /online_market_special.html {
        try_files /online_market_special.html =403;
    }

    # DingTalk notify assets. Token path is unlisted; robots fetch without htpasswd.
    location ~ "^/notify/[0-9a-f]{32}/(offline_youth|offline_high_school|offline_university|online_private|online_platform)/people\.png$" {
        auth_basic off;
        try_files $uri =404;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ "^/notify/[0-9a-f]{32}/(offline_youth|offline_high_school|offline_university|online_private|online_platform)/details\.xlsx$" {
        auth_basic off;
        try_files $uri =404;
        default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;
        add_header Content-Disposition "attachment; filename=details.xlsx";
    }

    location / {
        return 404;
    }
}
