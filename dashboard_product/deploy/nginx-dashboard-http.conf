# HTTP vhost for dashboard.apinova.cn with basic auth and per-user booklets.
# Include this file from the nginx http {} context (sites-enabled is fine).
# The map blocks MUST stay outside server {}.
#
# This round is HTTP-only. Basic auth credentials travel in Base64 on the wire
# (effectively plaintext). Put TLS in front before treating this as a real door.

map $remote_user $dashboard_booklet {
    default "";
    include /etc/nginx/dashboard-user-booklets.map;
}

# Resolve the on-disk file only when URI matches that user's booklet.
# Evaluated in the content phase (try_files), after auth_basic. Do not use
# `if` here: rewrite-phase if runs before auth and turns anonymous 401 into 403.
map "$uri/$dashboard_booklet" $dashboard_booklet_file {
    default /__booklet_denied;
    "/full.html/full" /full.html;
    "/online_private.html/online_private" /online_private.html;
    "/online_platform.html/online_platform" /online_platform.html;
    "/online_platform.html/full" /online_platform.html;
    "/offline_market.html/offline_market" /offline_market.html;
    "/online_market_special.html/full" /online_market_special.html;
    "/online_market_special.html/online_platform" /online_market_special.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.apinova.cn;

    root /var/www/dashboard;
    autoindex off;

    auth_basic "内部看板";
    auth_basic_user_file /etc/nginx/dashboard.htpasswd;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # After login, serve that user's booklet. Empty mapping → 403.
    # Do not fall back to full.html or leftover current.html.
    location = / {
        try_files /$dashboard_booklet.html =403;
    }

    location ~ ^/(full|online_private|online_platform|offline_market)\.html$ {
        try_files $dashboard_booklet_file =403;
    }

    location = /online_market_special.html {
        try_files $dashboard_booklet_file =403;
    }

    # DingTalk notify assets. Token path is unlisted; robots fetch without htpasswd.
    location ~ "^/notify/[0-9a-f]{32}/(offline_youth|offline_high_school|offline_university|online_private|online_platform)/people\.png$" {
        auth_basic off;
        try_files $uri =404;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ "^/notify/[0-9a-f]{32}/(offline_youth|offline_high_school|offline_university|online_private|online_platform)/details\.xlsx$" {
        auth_basic off;
        try_files $uri =404;
        default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;
        add_header Content-Disposition "attachment; filename=details.xlsx";
    }

    location / {
        return 404;
    }
}
