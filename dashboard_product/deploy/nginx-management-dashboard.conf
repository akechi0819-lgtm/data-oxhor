# Management dashboard vhost. Install only after the server's active Nginx
# configuration path has been confirmed.
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.apinova.cn;

    root /var/www/dashboard/current;
    autoindex off;

    auth_basic "内部看板";
    auth_basic_user_file /etc/nginx/dashboard.htpasswd;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html { try_files $uri =404; }
    location = /prep_high.html { try_files $uri =404; }
    location = /university.html { try_files $uri =404; }
    location = /online.html { try_files $uri =404; }

    location = /styles.css { try_files $uri =404; }
    location = /app.js { try_files $uri =404; }
    location = /boards.css { try_files $uri =404; }
    location = /boards.js { try_files $uri =404; }

    location = /data.json { try_files $uri =404; }
    location = /university.data.json { try_files $uri =404; }
    location = /prep_high.data.json { try_files $uri =404; }
    location = /prep_high.1.data.json { try_files $uri =404; }
    location = /prep_high.2.data.json { try_files $uri =404; }
    location = /prep_high.3.data.json { try_files $uri =404; }
    location = /prep_high.4.data.json { try_files $uri =404; }
    location = /prep_high.5.data.json { try_files $uri =404; }
    location = /prep_high.6.data.json { try_files $uri =404; }
    location = /prep_high.7.data.json { try_files $uri =404; }

    # Notify assets keep the existing unauthenticated, unguessable-token path
    # and continue reading from the original web root.
    location ~ "^/notify/[0-9a-f]{32}/(offline_youth|offline_high_school|offline_university|online_private|online_platform)/people\.png$" {
        root /var/www/dashboard;
        auth_basic off;
        try_files $uri =404;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ "^/notify/[0-9a-f]{32}/(offline_youth|offline_high_school|offline_university|online_private|online_platform)/details\.xlsx$" {
        root /var/www/dashboard;
        auth_basic off;
        try_files $uri =404;
        default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;
        add_header Content-Disposition "attachment; filename=details.xlsx";
    }

    location / {
        return 404;
    }
}
