<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="留学预备与高中管理看板" />
    <title>预备与高中看板 · 管理融合</title>
    <link rel="stylesheet" href="./boards.css" />
    <script src="./boards.js" defer></script>
  </head>
  <body data-board="prep_high">
    <div class="board-shell">
      <header class="board-topbar">
        <a class="brand-lockup" href="./index.html"><span class="brand-glyph" aria-hidden="true">组</span><span>管理看板<small>预备 / 高中</small></span></a>
        <nav class="top-links" aria-label="看板入口">
          <a href="./index.html">总览与工具</a>
          <a href="./university.html">大学看板</a>
          <a class="is-current" aria-current="page" href="./prep_high.html">预备 / 高中</a>
        </nav>
        <label class="period-filter" for="period-select"><span>经营期间</span><select id="period-select" disabled><option>读取期间中</option></select></label>
      </header>

      <section class="board-heading">
        <div class="heading-copy">
          <p class="eyebrow">预备与高中 · 经营回顾</p>
          <h1>留学预备与高中经营看板</h1>
          <p id="board-caption">按业务组分区展示 · 语培业绩与人员贡献分开统计</p>
        </div>
        <div class="freshness" id="freshness" aria-live="polite"><span class="fresh-dot" aria-hidden="true"></span><span><strong id="freshness-label">等待数据</strong><small id="freshness-date">读取中</small></span></div>
      </section>

      <div class="segment-filter" role="group" aria-label="业务组筛选"><strong>业务组（可多选）</strong><label><input type="checkbox" value="1" checked>青少</label><label><input type="checkbox" value="2" checked>初中</label><label><input type="checkbox" value="4" checked>高中</label><button type="button" data-groups="all">全选</button><button type="button" data-groups="none">清空</button><span id="segment-status" aria-live="polite"></span></div>
      <nav class="board-tabs" role="tablist" aria-label="预备与高中看板内容">
        <button type="button" role="tab" aria-selected="true" class="is-active" data-tab="overview">总览</button>
        <button type="button" role="tab" aria-selected="false" data-tab="details">渠道与学校</button>
        <button type="button" role="tab" aria-selected="false" data-tab="people">人员贡献</button>
      </nav>

      <main class="board-content">
        <div class="load-state" id="load-state" role="status" aria-live="polite">正在读取管理数据…</div>
        <section class="board-pane" id="pane-overview" role="tabpanel" aria-label="经营总览">
          <div class="period-note" id="period-note"></div>
          <div class="prep-teams" id="prep-teams">
            <section class="team-workspace" id="prep-overview" data-team-section="prep"><div class="empty-state">留学预备数据待加载</div></section>
            <section class="team-workspace" id="high-overview" data-team-section="high"><div class="empty-state">高中数据待加载</div></section>
          </div>
        </section>

        <section class="board-pane" id="pane-details" role="tabpanel" aria-label="渠道与学校" hidden><div id="flat-board-details"></div></section>

        <section class="board-pane" id="pane-people" role="tabpanel" aria-label="人员贡献" hidden>
          <div class="people-toolbar"><div class="section-bar"><div><span class="section-index">03</span><h2>个人月度完成</h2></div><p id="people-window" aria-live="polite">选择统计月份与月度口径</p></div><div class="person-controls"><button id="person-month-mode" class="month-mode" type="button" role="switch" aria-label="使用自然月统计个人完成" aria-checked="false" disabled><span>绩效月</span><span>自然月</span></button><label class="period-filter person-filter" for="person-period-select"><span>统计月份</span><select id="person-period-select" disabled><option>读取月份中</option></select></label></div></div>
          <div class="prep-people" id="prep-people"><div class="empty-state">个人数据待加载</div></div>
          <p class="table-hint">绩效月：上月26日至本月25日；自然月：本月1日至月末。</p>
        </section>
        <footer class="board-footer"><span>金额单位：元</span><span id="footer-source">数据截止日期以页面为准</span></footer>
      </main>
    </div>
  </body>
</html>
