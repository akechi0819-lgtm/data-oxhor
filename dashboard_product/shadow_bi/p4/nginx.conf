# 正式HTTPS入口：主页指向原生BI；权限由现有18原账号只读规则控制。
# receiver专用location由现网独立配置维护；本模板不得整份覆盖当前站点。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.apinova.cn;
    ssl_certificate /etc/letsencrypt/live/dashboard.apinova.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.apinova.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    autoindex off;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = / {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        return 302 https://dashboard.apinova.cn/superset/dashboard/shadow-bi-native/?standalone=1;
    }
    # 当前通知资产沿既有token路径/访问限制；不创建或发送通知。
    location ~ "^/notify/[0-9a-f]{32}/(offline_youth|offline_high_school|offline_university|online_private|online_platform)/people\.png$" {
        root /var/www/dashboard;
        auth_basic off;
        try_files $uri =404;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
    }
    location ~ "^/notify/[0-9a-f]{32}/(offline_youth|offline_high_school|offline_university|online_private|online_platform)/details\.xlsx$" {
        root /var/www/dashboard;
        auth_basic off;
        try_files $uri =404;
        default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;
        add_header Content-Disposition "attachment; filename=details.xlsx";
    }
    # 原生BI已使用的应用路径；不新增应用端点。
    location ~ "^/(?:api/|superset/|static/|p3(?:/|$)|explore(?:/|$)|login/?$|logout/?$|p4/version$|health$)" {
        if (-f /run/shadow-bi-maintenance) { return 503; }
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location / { return 404; }
}
