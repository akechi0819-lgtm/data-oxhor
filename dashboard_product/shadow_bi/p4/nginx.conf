# P4 HTTPS入口：旧首页与静态HTML统一跳转到原生BI，由新站保留三人权限。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.apinova.cn;
    ssl_certificate /etc/letsencrypt/live/dashboard.apinova.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.apinova.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    root /var/www/dashboard/current;
    autoindex off;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = / {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        return 302 https://dashboard.apinova.cn/superset/dashboard/shadow-bi-native/?standalone=1;
    }
    location = /index.html {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        return 302 https://dashboard.apinova.cn/superset/dashboard/shadow-bi-native/?standalone=1;
    }
    location = /online.html {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        return 302 https://dashboard.apinova.cn/superset/dashboard/shadow-bi-native/?standalone=1;
    }
    location = /prep_high.html {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        return 302 https://dashboard.apinova.cn/superset/dashboard/shadow-bi-native/?standalone=1;
    }
    location = /university.html {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        return 302 https://dashboard.apinova.cn/superset/dashboard/shadow-bi-native/?standalone=1;
    }
    # 旧HTML精确路由以上述跳转优先；静态产物仍沿用原认证白名单。
    location ~ "^/(?:(?:index|prep_high|university|online)\.html|(?:styles|boards)\.css|(?:app|boards)\.js|(?:data|university\.data|prep_high(?:\.[1-7])?\.data)\.json)$" {
        auth_basic "内部看板";
        auth_basic_user_file /etc/nginx/dashboard.htpasswd;
        try_files $uri =404;
    }
    # 保留旧通知的既有token路径/访问限制；不创建或发送通知。
    location ~ "^/notify/[0-9a-f]{32}/(offline_youth|offline_high_school|offline_university|online_private|online_platform)/people\.png$" {
        root /var/www/dashboard;
        auth_basic off;
        try_files $uri =404;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
    }
    location ~ "^/notify/[0-9a-f]{32}/(offline_youth|offline_high_school|offline_university|online_private|online_platform)/details\.xlsx$" {
        root /var/www/dashboard;
        auth_basic off;
        try_files $uri =404;
        default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;
        add_header Content-Disposition "attachment; filename=details.xlsx";
    }
    # 已实际使用的新站路径；旧静态精确白名单优先，不新增应用端点。
    location ~ "^/(?:api/|superset/|static/|p3(?:/|$)|explore(?:/|$)|login/?$|logout/?$|p4/version$|health$)" {
        if (-f /run/shadow-bi-maintenance) { return 503; }
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location / { return 404; }
}
