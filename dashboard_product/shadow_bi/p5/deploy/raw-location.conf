# Include inside the EXISTING dashboard HTTPS server. No new listener.
# External /shadow-bi/v1 prefix is mandatory; internal Flask uses /v1.
location = /shadow-bi/v1/raw-batches {
    rewrite ^/shadow-bi/v1/raw-batches$ /v1/raw-batches break;
    proxy_pass http://127.0.0.1:18091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 128m;
    proxy_read_timeout 120s;
    access_log off;
}
location ^~ /shadow-bi/v1/raw-batches/ {
    rewrite ^/shadow-bi/v1/raw-batches/(.*)$ /v1/raw-batches/$1 break;
    proxy_pass http://127.0.0.1:18091;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 1k;
    proxy_read_timeout 30s;
    access_log off;
}
