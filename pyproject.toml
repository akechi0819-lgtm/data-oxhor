[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "education-business-analyst"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.5",
]

[project.optional-dependencies]
core = []
test = ["openpyxl==3.1.5"]
ppt = [
  "python-pptx==1.0.2",
  "XlsxWriter==3.2.9",
  "skia-pathops==0.9.2",
  "uharfbuzz==0.56.0",
]
full = [
  "python-pptx==1.0.2",
  "XlsxWriter==3.2.9",
  "skia-pathops==0.9.2",
  "uharfbuzz==0.56.0",
  "edge-tts==7.2.8",
  "PyMuPDF==1.28.2",
  "mammoth==1.12.1",
  "markdownify==1.2.3",
  "EbookLib==0.20",
  "nbconvert==7.17.1",
  "openpyxl==3.1.5",
  "Pillow==12.3.0",
  "numpy==2.5.2",
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
  "curl_cffi==0.16.0",
  "google-genai==2.18.1",
  "Flask==3.1.3",
]

[project.scripts]
data-foundation = "interfaces.data_foundation:main"
business-pack = "interfaces.business_pack:main"
company-bridge = "interfaces.company_bridge:main"
bridge-alignment-wizard = "interfaces.bridge_alignment_wizard:main"
casebook-pilot = "interfaces.casebook_pilot:main"
onboarding = "interfaces.onboarding:main"

[tool.setuptools.packages.find]
include = ["bridge_alignment*", "business_pack*", "casebook*", "company_bridge*", "data_foundation*", "interfaces*", "onboarding*", "pilot_feedback*"]

[tool.setuptools.package-data]
business_pack = ["packs/**/*.json"]
