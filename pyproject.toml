[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-oxhor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.5",
]

[project.optional-dependencies]
core = []
test = ["openpyxl==3.1.5"]
full = [
  "openpyxl==3.1.5",
  "Pillow==12.3.0",
]

[project.scripts]
data-platform = "interfaces.data_platform:main"
business-pack = "interfaces.business_pack:main"
company-bridge = "interfaces.company_bridge:main"
workspace-modeling = "interfaces.workspace_modeling:main"
casebook = "interfaces.casebook:main"

[tool.setuptools.packages.find]
include = ["workspace_modeling*", "data_platform*", "data_acquisition*", "analysis_product*", "dashboard_product*", "interfaces*"]

[tool.setuptools.package-data]
"workspace_modeling.business_pack" = ["packs/**/*.json"]
