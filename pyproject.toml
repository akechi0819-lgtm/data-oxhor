[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "education-business-analyst"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.5",
]

[project.optional-dependencies]
test = ["openpyxl==3.1.5"]

[project.scripts]
data-foundation = "interfaces.data_foundation:main"
business-pack = "interfaces.business_pack:main"
company-bridge = "interfaces.company_bridge:main"

[tool.setuptools.packages.find]
include = ["business_pack*", "company_bridge*", "data_foundation*", "interfaces*"]

[tool.setuptools.package-data]
business_pack = ["packs/**/*.json"]
