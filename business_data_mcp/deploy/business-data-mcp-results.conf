# Expire all query results and per-key directories after 24 hours, including
# results whose bearer key has since been revoked.
d /var/lib/business-data-mcp/results 0700 business-mcp business-mcp mM:24h -
e /var/lib/business-data-mcp/results/.reservations - - - mM:2h -
x /var/lib/business-data-mcp/results/.capacity.lock - - - - -
